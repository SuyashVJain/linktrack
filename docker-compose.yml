services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linktrack
      POSTGRES_USER: linktrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linktrack"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://linktrack:${POSTGRES_PASSWORD}@postgres:5432/linktrack?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
